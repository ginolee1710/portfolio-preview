<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="jcTitle jcDesc">
  <title id="jcTitle">From curiosity to a digital shop</title>
  <desc id="jcDesc">Abstract path from a screen, through four purpose circles, to a small shop and a globe. No product or sales figures.</desc>
  <defs>
    <linearGradient id="jc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1522"/>
      <stop offset="55%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#1a2740"/>
    </linearGradient>
    <linearGradient id="jc-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fd0" stop-opacity=".12"/>
      <stop offset="50%" stop-color="#8fb3ff" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#2f6fd0" stop-opacity=".12"/>
    </linearGradient>
    <filter id="jc-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="url(#jc-bg)"/>
  <ellipse cx="620" cy="220" rx="460" ry="130" fill="url(#jc-glow)" filter="url(#jc-soft)"/>
  <g fill="#8fb3ff" opacity=".14">
    <circle cx="70" cy="54" r="2"/><circle cx="150" cy="96" r="2"/><circle cx="230" cy="48" r="2"/>
    <circle cx="980" cy="60" r="2"/><circle cx="1060" cy="100" r="2"/><circle cx="1140" cy="50" r="2"/>
    <circle cx="90" cy="360" r="2"/><circle cx="180" cy="380" r="2"/><circle cx="1110" cy="360" r="2"/>
  </g>
  <path d="M210 250 C 320 250, 360 150, 470 168 C 580 186, 620 280, 740 250 C 860 220, 900 150, 1020 190" fill="none" stroke="#8fb3ff" stroke-width="2" opacity=".7"/>
  <!-- screen -->
  <g>
    <rect x="120" y="128" width="150" height="100" rx="12" fill="#1d3a6e" stroke="#8fb3ff" stroke-width="2"/>
    <polygon points="178,158 178,198 214,178" fill="#8fb3ff"/>
    <text x="195" y="258" text-anchor="middle" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="16">Topics</text>
  </g>
  <!-- ikigai -->
  <g fill="none" stroke="#8fb3ff" stroke-width="2">
    <circle cx="470" cy="150" r="28" fill="#1d3a6e"/>
    <circle cx="518" cy="150" r="28" fill="#1d3a6e"/>
    <circle cx="494" cy="192" r="28" fill="#1d3a6e"/>
    <circle cx="494" cy="128" r="18" fill="none" stroke="#e6eaf2" stroke-opacity=".7"/>
  </g>
  <text x="494" y="258" text-anchor="middle" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="16">Ikigai</text>
  <!-- spark / make -->
  <g>
    <circle cx="740" cy="250" r="32" fill="#1d3a6e" stroke="#8fb3ff" stroke-width="2"/>
    <path d="M740 230 L746 246 L764 248 L750 260 L754 278 L740 268 L726 278 L730 260 L716 248 L734 246 Z" fill="#8fb3ff"/>
    <text x="740" y="308" text-anchor="middle" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="16">Make</text>
  </g>
  <!-- shop + globe -->
  <g>
    <path d="M960 210 h120 v52 h-120 z" fill="#1d3a6e" stroke="#8fb3ff" stroke-width="2"/>
    <path d="M948 210 h144 l-16-28 h-112 z" fill="#243e74" stroke="#8fb3ff" stroke-width="2"/>
    <rect x="1004" y="226" width="32" height="36" fill="#0f1522" stroke="#8fb3ff"/>
    <circle cx="1128" cy="150" r="26" fill="none" stroke="#8fb3ff" stroke-width="2"/>
    <path d="M1102 150 h52 M1128 124 v52 M1108 136c8 8 24 8 40 0 M1108 164c8-8 24-8 40 0" fill="none" stroke="#8fb3ff" stroke-width="1.4"/>
    <text x="1020" y="292" text-anchor="middle" fill="#a3adc2" font-family="system-ui,sans-serif" font-size="16">Shop</text>
  </g>
</svg>
